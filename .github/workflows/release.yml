name: Release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build RPM
        run: bash build-rpm.sh

      # ponytail: ubuntu-latest ships podman; only swap if :z/:Z mount flags misbehave on hosted runners
      - name: Tag and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rpms=(dist/*.rpm)
          rpm="${rpms[0]}"
          [[ "$(basename "$rpm")" =~ ^[^-]+-(.+)\.([^.]+)\.rpm$ ]] || exit 1
          tag="v${BASH_REMATCH[1]}"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" "$rpm" --generate-notes
