name: Release
on:
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild and re-upload even when every RPM name already exists on this tag
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  # ponytail: nix side is already incremental — cachix substitutes anything unchanged.
  # Consumers: https://wombatfromhell.cachix.org
  #            wombatfromhell.cachix.org-1:pyIVJJkoLxkjH/MKK1ylrrdJKPpm+aXLeD2zAqVk9lA=
  nix:
    runs-on: ubuntu-26.04
    environment: cachix
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31

      - uses: cachix/cachix-action@v17
        with:
          name: wombatfromhell
          authToken: "${{ secrets.CACHIX_AUTH_TOKEN }}"
          skipPush: true

      # `^*` = all outputs (out + doc); cachix push uploads just their runtime closures
      - run: |
          nix build '.#niri^*' '.#xwayland-satellite^*' --no-link --print-out-paths --print-build-logs \
            | cachix push wombatfromhell

  # ponytail: the tag is a hash of everything that defines or is COPY'd into the image, so
  # "tag exists" == "image matches this commit". Runs in seconds when nothing changed.
  # To pick up newer Fedora packages, touch a comment in the Containerfile (new hash).
  image:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      ref: ${{ steps.ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      # GHCR requires lowercase; the owner here has capitals
      - id: ref
        run: |
          hash="$(cat Containerfile entrypoint.sh entrypoint-satellite.sh container-lib.sh | sha256sum | cut -c1-12)"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/niri-spicy-builder:${hash}" >> "$GITHUB_OUTPUT"

      - name: Build and push if this tag doesn't exist yet
        env:
          REF: ${{ steps.ref.outputs.ref }}
          GH_TOKEN: ${{ github.token }}
        run: |
          podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          if skopeo inspect "docker://$REF" >/dev/null 2>&1; then
            echo "==> $REF already exists"
          else
            podman build -t "$REF" -f Containerfile .
            podman push "$REF"
          fi

  rpm:
    needs: image
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: read
    env:
      BUILDER_IMAGE: ${{ needs.image.outputs.ref }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        env:
          GH_TOKEN: ${{ github.token }}
        run: podman login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"

      # ponytail: exact hit on the same pins; otherwise the restore-keys prefix restores the
      # previous pins' deps, so a bump only recompiles niri/smithay, not every registry crate.
      # (.builder-cache/src is deliberately not cached — sync_repo re-clones it.)
      - uses: actions/cache@v6
        with:
          path: |
            .builder-cache/cargo
            .builder-cache/target
            .builder-cache/satellite-cargo
            .builder-cache/satellite-target
          key: rpm-cargo-${{ hashFiles('pins.json') }}
          restore-keys: rpm-cargo-

      # ponytail: RPM names are version + 7-char git hash + dist/arch — knowable without
      # compiling, and the hash means "name exists" == "artifact exists". niri's predicted
      # name also determines the release tag, so check only that tag's assets (no history walk).
      - name: Predict RPM names and decide what to build
        id: predict
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force }}
        run: |
          bash build-rpm-spicy.sh --name-only | tail -n1 > predicted-names.txt
          bash build-rpm-satellite.sh --name-only | tail -n1 >> predicted-names.txt

          niri_rpm="$(sed -n '1p' predicted-names.txt)"
          satellite_rpm="$(sed -n '2p' predicted-names.txt)"

          [[ "$niri_rpm" =~ ^[^-]+-(.+)\.([^.]+)\.rpm$ ]] || exit 1
          tag="v${BASH_REMATCH[1]}"

          existing=""
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" --jq '.assets[].name')"
          fi

          build_niri=true
          build_satellite=true
          if [[ "$FORCE" != true ]]; then
            grep -Fxq "$niri_rpm" <<<"$existing" && build_niri=false
            grep -Fxq "$satellite_rpm" <<<"$existing" && build_satellite=false
          fi

          if [[ "$build_niri" == false && "$build_satellite" == false ]]; then
            echo "::error::both RPMs already on $tag; rerun with 'force' to rebuild anyway"
            exit 1
          fi

          {
            echo "tag=$tag"
            echo "build_niri=$build_niri"
            echo "build_satellite=$build_satellite"
          } >>"$GITHUB_OUTPUT"

      - name: Build niri (spicy) RPM
        if: steps.predict.outputs.build_niri == 'true'
        run: bash build-rpm-spicy.sh

      - name: Build xwayland-satellite RPM
        if: steps.predict.outputs.build_satellite == 'true'
        run: bash build-rpm-satellite.sh

      # ponytail: ubuntu-latest ships podman; only swap if :z/:Z mount flags misbehave on hosted runners
      - name: Tag and create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.predict.outputs.tag }}
        run: |
          source container-lib.sh
          verify_rpm_names predicted-names.txt

          if gh release view "$TAG" >/dev/null 2>&1; then
            # tag already exists: just add/overwrite this run's assets
            gh release upload "$TAG" dist/*.rpm --clobber
          else
            git tag "$TAG"
            git push origin "$TAG"
            gh release create "$TAG" dist/*.rpm --generate-notes
          fi
