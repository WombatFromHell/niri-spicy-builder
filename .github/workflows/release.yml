name: Release
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build niri (spicy) RPM
        run: bash build-rpm-spicy.sh

      - name: Build xwayland-satellite RPM
        run: bash build-rpm-satellite.sh

      # ponytail: ubuntu-latest ships podman; only swap if :z/:Z mount flags misbehave on hosted runners
      - name: Tag and create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tag off the niri RPM (primary artifact); upload every RPM in dist/
          niri_rpm="dist/niri-*.rpm"
          [[ -e "$niri_rpm" ]] || { echo "niri RPM missing"; exit 1; }
          rpm="${niri_rpm}"
          [[ "$(basename "$rpm")" =~ ^[^-]+-(.+)\.([^.]+)\.rpm$ ]] || exit 1
          tag="v${BASH_REMATCH[1]}"
          git tag "$tag"
          git push origin "$tag"
          gh release create "$tag" dist/*.rpm --generate-notes
